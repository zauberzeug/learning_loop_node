name: Run Tests

on: [push]

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: install dependencies
        # --locked fails on a lockfile that no longer matches pyproject.toml
        run: uv sync --extra dev --locked --python ${{ matrix.python-version }}
      - name: check interpreter
        run: uv run --no-sync python -c "import sys; assert sys.version_info[:2] == tuple(map(int, '${{ matrix.python-version }}'.split('.'))), sys.version"
      - name: test_unit
        # no Learning Loop and no secrets needed, so this suite gates the slow ones
        run: uv run --no-sync python -m pytest learning_loop_node/tests/unit -v

  pytest:
    needs:
      - unit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read # the cleanup step asks whether the run that left a project behind is over
    env:
      # the suites share one Learning Loop instance and create and delete their projects there; the
      # suffix gives every job of every run its own (pytest_nodelib_general_<suffix>, ...), so two
      # runs at once -- two branches pushed close together -- cannot delete each other's project.
      # cleanup_test_projects reads the run back out of the name, keep the format in step
      LOOP_TEST_PROJECT_SUFFIX: ${{ github.run_id }}_${{ github.run_attempt }}_${{ strategy.job-index }}
    strategy:
      fail-fast: false
      # the projects no longer collide, but every entry still reads from and uploads to the shared
      # zauberzeug/demo project; one entry at a time keeps a run's load on the preview loop down
      max-parallel: 1
      matrix:
        # the floor requires-python promises, and the version every node ships with; the unit
        # job covers 3.11 and 3.13 too
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install libcurl4-openssl-dev libssl-dev jpeginfo
      - name: install dependencies
        run: uv sync --extra dev --locked --python ${{ matrix.python-version }}
      - name: test_general
        env:
          LOOP_HOST: "preview.learning-loop.ai"
          LOOP_USERNAME: "admin"
          LOOP_PASSWORD: ${{ secrets.LEARNING_LOOP_ADMIN_PASSWORD }}
        run: uv run --no-sync python -m pytest learning_loop_node/tests/general -v
      - name: test_detector
        env:
          LOOP_HOST: "preview.learning-loop.ai"
          LOOP_USERNAME: "admin"
          LOOP_PASSWORD: ${{ secrets.LEARNING_LOOP_ADMIN_PASSWORD }}
        run: uv run --no-sync python -m pytest learning_loop_node/tests/detector -v
      - name: test_mock_detector
        env:
          LOOP_HOST: "preview.learning-loop.ai"
          LOOP_USERNAME: "admin"
          LOOP_PASSWORD: ${{ secrets.LEARNING_LOOP_ADMIN_PASSWORD }}
        run: uv run --no-sync python -m pytest mock_detector -v
      - name: test_annotator
        env:
          LOOP_HOST: "preview.learning-loop.ai"
          LOOP_USERNAME: "admin"
          LOOP_PASSWORD: ${{ secrets.LEARNING_LOOP_ADMIN_PASSWORD }}
        run: uv run --no-sync python -m pytest learning_loop_node/tests/annotator -v
      - name: test_trainer
        env:
          LOOP_HOST: "preview.learning-loop.ai"
          LOOP_USERNAME: "admin"
          LOOP_PASSWORD: ${{ secrets.LEARNING_LOOP_ADMIN_PASSWORD }}
        run: uv run --no-sync python -m pytest learning_loop_node/tests/trainer -v
      - name: test_mock_trainer
        env:
          LOOP_HOST: "preview.learning-loop.ai"
          LOOP_USERNAME: "admin"
          LOOP_PASSWORD: ${{ secrets.LEARNING_LOOP_ADMIN_PASSWORD }}
        run: uv run --no-sync python -m pytest mock_trainer -v
      - name: clean up test projects
        # always() also runs after a cancellation, when no teardown deleted this job's projects; it
        # also sweeps those of earlier runs that are over, which a lost runner never got to delete
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        env:
          LOOP_HOST: "preview.learning-loop.ai"
          LOOP_USERNAME: "admin"
          LOOP_PASSWORD: ${{ secrets.LEARNING_LOOP_ADMIN_PASSWORD }}
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --no-sync python -m learning_loop_node.tests.cleanup_test_projects

  all-green:
    # the one status check the branch ruleset requires: a matrix job's check run is named
    # "<job> (<entry>)", so requiring the entries themselves ties the ruleset to the matrix
    # and every change to it leaves the ruleset waiting for a name nothing reports any more
    needs:
      - unit
      - pytest
    if: always() # a required check that is skipped reports nothing and waits forever
    runs-on: ubuntu-latest
    steps:
      - name: check the jobs it gates
        # skipped and cancelled have to fail too -- only success is green
        run: |
          echo "unit: ${{ needs.unit.result }}, pytest: ${{ needs.pytest.result }}"
          [ "${{ needs.unit.result }}" = success ] || exit 1
          [ "${{ needs.pytest.result }}" = success ] || exit 1

  slack:
    needs:
      - unit
      - pytest
    if: always() # also execute when pytest fails
    runs-on: ubuntu-latest
    steps:
      - name: Determine if we need to notify
        uses: Jimdo/should-i-notify-action@main
        id: should_notify
        with:
          needs_context: ${{ toJson(needs) }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Slack workflow notification
        if: steps.should_notify.outputs.should_send_message == 'yes'
        uses: Gamesight/slack-workflow-status@master
        with:
          repo_token: ${{ secrets.GIT_HUB_TOKEN }}
          slack_webhook_url: ${{ secrets.SLACK_DEEPLEARNING_CI_WEBHOOK }}
          channel: "deeplearning-ci"
          name: "Learning Loop Node"
