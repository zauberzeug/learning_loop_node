name: Run Tests

on: [push]

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: install dependencies
        # --locked fails on a lockfile that no longer matches pyproject.toml
        run: uv sync --extra dev --locked --python ${{ matrix.python-version }}
      - name: check interpreter
        run: uv run --no-sync python -c "import sys; assert sys.version_info[:2] == tuple(map(int, '${{ matrix.python-version }}'.split('.'))), sys.version"
      - name: test_unit
        # no Learning Loop and no secrets needed, so this suite gates the slow ones
        run: uv run --no-sync python -m pytest learning_loop_node/tests/unit -v

  pytest:
    needs:
      - unit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # these suites share one Learning Loop instance, and test_general creates and deletes
      # the project zauberzeug/pytest_nodelib_general by a fixed name -- two entries at once
      # would delete each other's project
      max-parallel: 1
      matrix:
        # the ends of what requires-python promises; the unit job covers 3.11 and 3.12 too,
        # and no node runs anything outside this range
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install libcurl4-openssl-dev libssl-dev jpeginfo
      - name: install dependencies
        run: uv sync --extra dev --locked --python ${{ matrix.python-version }}
      - name: test_general
        env:
          LOOP_HOST: "preview.learning-loop.ai"
          LOOP_USERNAME: "admin"
          LOOP_PASSWORD: ${{ secrets.LEARNING_LOOP_ADMIN_PASSWORD }}
        run: uv run --no-sync python -m pytest learning_loop_node/tests/general -v
      - name: test_detector
        env:
          LOOP_HOST: "preview.learning-loop.ai"
          LOOP_USERNAME: "admin"
          LOOP_PASSWORD: ${{ secrets.LEARNING_LOOP_ADMIN_PASSWORD }}
        run: uv run --no-sync python -m pytest learning_loop_node/tests/detector -v
      - name: test_mock_detector
        env:
          LOOP_HOST: "preview.learning-loop.ai"
          LOOP_USERNAME: "admin"
          LOOP_PASSWORD: ${{ secrets.LEARNING_LOOP_ADMIN_PASSWORD }}
        run: uv run --no-sync python -m pytest mock_detector -v
      - name: test_annotator
        env:
          LOOP_HOST: "preview.learning-loop.ai"
          LOOP_USERNAME: "admin"
          LOOP_PASSWORD: ${{ secrets.LEARNING_LOOP_ADMIN_PASSWORD }}
        run: uv run --no-sync python -m pytest learning_loop_node/tests/annotator -v
      - name: test_trainer
        env:
          LOOP_HOST: "preview.learning-loop.ai"
          LOOP_USERNAME: "admin"
          LOOP_PASSWORD: ${{ secrets.LEARNING_LOOP_ADMIN_PASSWORD }}
        run: uv run --no-sync python -m pytest learning_loop_node/tests/trainer -v
      - name: test_mock_trainer
        env:
          LOOP_HOST: "preview.learning-loop.ai"
          LOOP_USERNAME: "admin"
          LOOP_PASSWORD: ${{ secrets.LEARNING_LOOP_ADMIN_PASSWORD }}
        run: uv run --no-sync python -m pytest mock_trainer -v

  slack:
    needs:
      - unit
      - pytest
    if: always() # also execute when pytest fails
    runs-on: ubuntu-latest
    steps:
      - name: Determine if we need to notify
        uses: Jimdo/should-i-notify-action@main
        id: should_notify
        with:
          needs_context: ${{ toJson(needs) }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Slack workflow notification
        if: steps.should_notify.outputs.should_send_message == 'yes'
        uses: Gamesight/slack-workflow-status@master
        with:
          repo_token: ${{ secrets.GIT_HUB_TOKEN }}
          slack_webhook_url: ${{ secrets.SLACK_DEEPLEARNING_CI_WEBHOOK }}
          channel: "deeplearning-ci"
          name: "Learning Loop Node"
