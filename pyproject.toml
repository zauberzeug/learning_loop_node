[project]
name = "learning_loop_node"
version = "0.18.6"
description = "Python Library for Nodes which connect to the Zauberzeug Learning Loop"
authors = [{ name = "Zauberzeug GmbH", email = "info@zauberzeug.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.135,<1.0",
    "uvicorn[standard]>=0.22.0,<1.0.0",
    "requests>=2.33.0,<3.0.0",
    "python-socketio>=5.16.2,<6.0.0",
    "aiofiles>=0.7.0",
    "python-multipart>=0.0.31",
    "psutil>=5.9.0,<8.0.0",
    "numpy>=2.0,<3.0",
    "Pillow>=12.3.0,<13.0.0",
    "tqdm>=4.66.3,<5.0.0",
    "pynvml>=11.4.1,<13.0.0", # 13 renames the distribution to nvidia-ml-py
    "aiohttp>=3.14.3,<4.0.0",
    "httpx>=0.28.1,<0.29.0",
    "dacite>=1.8.1,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest-flakefinder>=1.1.0,<2.0.0",
    "pytest-mock>=3.6.1,<4.0.0",
    "icecream>=2.1.0,<3.0.0",
    "retry>=0.9.2,<0.10.0",
    "debugpy>=1.6.7.post1,<2.0.0",
    "pytest-asyncio>=0.21.1,<0.22.0",
    "autopep8>=2.0.2,<3.0.0",
]

[project.urls]
Repository = "https://github.com/zauberzeug/learning_loop_node"

[tool.setuptools.packages.find]
where = ["."]
include = ["learning_loop_node", "learning_loop_node.*"]
exclude = ["learning_loop_node.tests*", "learning_loop_node.examples*"]

[tool.mypy]
ignore_missing_imports = true


[tool.ruff]
indent-width = 4
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "I",   # isort
    "E",   # pycodestyle
    "W",   # pycodestyle
    "B",   # bugbear
    "F",   # pyflakes
    "UP",  # pyupgrade
    "RUF", # ruff
    "PL",  # pylint
    "NPY201", # NumPy 2.0
    "Q",   # flake8-quotes
]
fixable = [
    "I",  # isort
    "RUF022", # `__all__` is not sorted
    "Q",  # flake8-quotes
]
ignore = [
    "E501", # line too long
    "E741",
    "PLR2004", # magic value comparison
    "Q001",  # multi line quotes
    "Q002",  # docstring quotes
    "PLR0911", # too many
    "PLR0912", # too many
    "PLR0913", # too many arguments
    "PLR0915", # too many arguments
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
multiline-quotes = "single"
docstring-quotes = "double"
avoid-escape = true
